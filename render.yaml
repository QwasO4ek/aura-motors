services:
  # Render Blueprint for AURA MOTORS
  # Static Site configuration (Fast global CDN, 100% free, no cold starts)
  - type: static
    name: aura-motors
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
